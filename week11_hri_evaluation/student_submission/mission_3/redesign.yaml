week11_interaction_demo:
  ros__parameters:
    motion_enabled: false
    approach_speed_mps: 0.08
    confirmation_required: true
   
    #Change 1: longer confirm window
    timeout_s: 30.0
    intent_message: "I will move closer, stop one meter away, then ask for a command. Press STOP at any time."

    #changing listening message and adding example + recovery steps
    listening_message: "LISTENING - type a request such as: bring the blue cup. After I repeat it, reply yes. If I time out, nothing happened: just type your request again. Choose Cancel or press STOP at any time."
